<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DaVinci Resolve Color Grading — From LOG to Cinematic</title>
<meta name="description" content="An interactive, beginner-to-intermediate course on color grading in DaVinci Resolve: Light, Color Hierarchy, Color Toning, Color Compression, Texture.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0B0E11; --bg-panel:#12161B; --bg-raised:#1A1F26; --bg-raised-2:#20262E;
  --ink:#E8E6E1; --ink-dim:#9BA3AE; --ink-faint:#5C636D;
  --accent:#E8A33D; --accent-ink:#1A1206; --accent-soft:rgba(232,163,61,.14);
  --accent2:#3FA9A0; --accent2-soft:rgba(63,169,160,.14);
  --line:#242A32; --line-soft:#1B2028;
  --success:#5FB88A; --success-soft:rgba(95,184,138,.14);
  --danger:#DD6E52; --danger-soft:rgba(221,110,82,.12);
  --radius-sm:3px; --radius:6px; --radius-lg:10px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --topbar-h:60px; --sidebar-w:288px; --content-max:760px;
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg:#F1F2F0; --bg-panel:#FFFFFF; --bg-raised:#F7F7F5; --bg-raised-2:#EFEFEC;
  --ink:#15181C; --ink-dim:#565F68; --ink-faint:#8A9199;
  --accent:#B4720F; --accent-ink:#FFF8EC; --accent-soft:rgba(180,114,15,.10);
  --accent2:#1D7B74; --accent2-soft:rgba(29,123,116,.10);
  --line:#E2E4E2; --line-soft:#ECEEEC;
  --success:#2E8A5E; --success-soft:rgba(46,138,94,.10);
  --danger:#B84B33; --danger-soft:rgba(184,75,51,.08);
  --shadow:0 8px 24px rgba(20,20,15,.08);
  color-scheme: light;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15.5px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; line-height:1.2; margin:0; color:var(--ink);}
p{margin:0 0 .9em 0; color:var(--ink);}
p:last-child{margin-bottom:0;}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer;}
.mono{font-family:var(--font-mono);}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}

/* ============================================================
   2. LAYOUT SHELL
   ============================================================ */
#app{min-height:100vh;}
.topbar{
  position:sticky; top:0; z-index:40; height:var(--topbar-h);
  display:flex; align-items:center; gap:14px; padding:0 16px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap; letter-spacing:.01em;}
.topbar-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.topbar-search{flex:1; max-width:360px; position:relative; display:none;}
@media(min-width:860px){ .topbar-search{display:block;} }
.topbar-search input{
  width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--radius); padding:8px 12px 8px 34px; font-size:13.5px; font-family:var(--font-body);
}
.topbar-search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.55;}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:8px;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
  border-radius:var(--radius); border:1px solid transparent; background:transparent; color:var(--ink-dim);
}
.icon-btn:hover{background:var(--bg-raised); color:var(--ink); border-color:var(--line);}
.progress-pill{
  display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
  background:var(--bg-raised); border:1px solid var(--line); font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);
  white-space:nowrap;
}
.progress-pill .bar{width:52px; height:5px; border-radius:3px; background:var(--line); overflow:hidden;}
.progress-pill .bar > span{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s ease;}

.shell{display:flex; align-items:flex-start;}
.sidebar{
  width:var(--sidebar-w); flex:none; position:sticky; top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h)); overflow-y:auto; border-right:1px solid var(--line);
  padding:16px 10px 40px; background:var(--bg-panel);
  display:none;
}
@media(min-width:1024px){ .sidebar{display:block;} }
.sidebar::-webkit-scrollbar{width:8px;} .sidebar::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.sb-link{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius); color:var(--ink-dim);
  font-size:13.5px; text-decoration:none; margin-bottom:2px;
}
.sb-link:hover{background:var(--bg-raised); color:var(--ink);}
.sb-link.active{background:var(--accent-soft); color:var(--accent); font-weight:500;}
.sb-section-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; color:var(--ink-faint); padding:16px 10px 6px; text-transform:uppercase;}
.sb-module{margin-bottom:2px;}
.sb-module-head{
  width:100%; display:flex; align-items:center; gap:8px; padding:9px 10px; background:transparent; border:none;
  border-radius:var(--radius); color:var(--ink); font-size:13px; font-weight:500; text-align:left;
}
.sb-module-head:hover{background:var(--bg-raised);}
.sb-module-head .chev{margin-left:auto; width:14px; height:14px; opacity:.6; transition:transform .18s ease; flex:none;}
.sb-module-head[aria-expanded="true"] .chev{transform:rotate(90deg);}
.sb-module-progress{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}
.sb-lessons{padding-left:10px; border-left:1px solid var(--line-soft); margin-left:19px; overflow:hidden; max-height:0; transition:max-height .22s ease;}
.sb-lessons.open{max-height:900px;}
.sb-lesson{
  display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px; border:none; background:transparent;
  border-radius:var(--radius-sm); color:var(--ink-dim); font-size:12.7px; text-align:left; text-decoration:none;
}
.sb-lesson:hover{background:var(--bg-raised); color:var(--ink);}
.sb-lesson.current{background:var(--accent-soft); color:var(--accent); font-weight:500;}
.sb-lesson .check{width:14px; height:14px; flex:none; border-radius:50%; border:1.5px solid var(--ink-faint); display:flex; align-items:center; justify-content:center;}
.sb-lesson.done .check{background:var(--success); border-color:var(--success);}
.sb-lesson.done .check svg{width:9px;height:9px;stroke:var(--bg);}
.sb-lesson .bk{width:11px;height:11px; margin-left:auto; flex:none; opacity:.85;}

.drawer-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:49; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.drawer-backdrop.open{opacity:1; pointer-events:auto;}
@media(min-width:1024px){ .drawer-backdrop{display:none;} }
.mobile-sidebar{position:fixed; top:0; left:0; bottom:0; width:min(300px,86vw); background:var(--bg-panel); z-index:50; transform:translateX(-100%); transition:transform .22s ease; overflow-y:auto; padding:14px 10px 40px; border-right:1px solid var(--line);}
.mobile-sidebar.open{transform:translateX(0);}
@media(min-width:1024px){ .mobile-sidebar{display:none;} }
.mobile-sidebar-head{display:flex; align-items:center; justify-content:space-between; padding:6px 6px 14px;}

main.content{flex:1; min-width:0; padding:28px 18px 90px;}
@media(min-width:640px){ main.content{padding:36px 32px 100px;} }
.page{max-width:var(--content-max); margin:0 auto;}
.page-wide{max-width:1040px; margin:0 auto;}

/* ============================================================
   3. COMPONENTS — cards, badges, buttons
   ============================================================ */
.card{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:var(--radius); font-size:14px; font-weight:500; border:1px solid transparent; min-height:44px; text-decoration:none;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost:hover{background:var(--bg-raised);}
.btn-sm{padding:8px 14px; font-size:13px; min-height:36px;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-family:var(--font-mono); background:var(--bg-raised); color:var(--ink-dim); border:1px solid var(--line);}
.badge-accent{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.badge-accent2{background:var(--accent2-soft); color:var(--accent2); border-color:transparent;}
.eyebrow-mono{font-family:var(--font-mono); font-size:11px; letter-spacing:.09em; color:var(--accent2); text-transform:uppercase;}

.section-card{border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 22px; margin-bottom:16px; background:var(--bg-panel);}
.section-card h3{font-size:14.5px; display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.section-card h3 svg{width:17px;height:17px; color:var(--accent); flex:none;}
.section-card.tool h3 svg{color:var(--accent2);}
.section-card.why{background:linear-gradient(180deg,var(--accent-soft),transparent 140%); border-color:var(--line);}
.step-list{list-style:none; margin:0; padding:0; counter-reset:step;}
.step-list li{counter-increment:step; display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:14px;}
.step-list li:last-child{border-bottom:none;}
.step-list li::before{content:counter(step); flex:none; width:23px; height:23px; border-radius:50%; background:var(--bg-raised); border:1px solid var(--line); color:var(--accent); font-family:var(--font-mono); font-size:11.5px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.watch-list{list-style:none; margin:0; padding:0;}
.watch-list li{display:flex; gap:10px; padding:7px 0; font-size:14px;}
.watch-list li svg{flex:none; width:15px; height:15px; margin-top:3px; color:var(--accent2);}
.mistake-card{display:flex; gap:11px; padding:13px 14px; border-radius:var(--radius); background:var(--danger-soft); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); margin-bottom:9px;}
.mistake-card:last-child{margin-bottom:0;}
.mistake-card svg{flex:none; width:17px; height:17px; color:var(--danger); margin-top:2px;}
.mistake-card strong{display:block; font-size:13.5px; margin-bottom:2px;}
.mistake-card p{font-size:13.5px; color:var(--ink-dim);}
.tip-card{display:flex; gap:11px; padding:15px 16px; border-radius:var(--radius); background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);}
.tip-card svg{flex:none; width:18px; height:18px; color:var(--accent); margin-top:1px;}

/* checklist */
.checklist-item{display:flex; align-items:flex-start; gap:11px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:14px; cursor:pointer;}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input{margin-top:3px; width:17px; height:17px; accent-color:var(--success); flex:none;}
.checklist-item.checked span{color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line);}
.checklist-progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:14px;}
.checklist-progress > span{display:block; height:100%; background:var(--success); transition:width .3s ease;}

/* quiz */
.quiz-opt{display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius); border:1px solid var(--line); margin-bottom:8px; font-size:14px; background:var(--bg-raised);}
.quiz-opt input{accent-color:var(--accent); width:16px; height:16px; flex:none;}
.quiz-opt.correct{border-color:var(--success); background:var(--success-soft);}
.quiz-opt.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.quiz-feedback{margin-top:10px; padding:12px 14px; border-radius:var(--radius); font-size:13.5px;}
.quiz-feedback.ok{background:var(--success-soft); color:var(--ink);}
.quiz-feedback.no{background:var(--danger-soft); color:var(--ink);}

/* notes / bookmarks */
textarea.note-box{width:100%; min-height:84px; background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius); color:var(--ink); padding:11px 13px; font-family:var(--font-body); font-size:13.5px; resize:vertical;}

/* tables */
.ref-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.ref-table th{text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); padding:10px 12px; border-bottom:1px solid var(--line);}
.ref-table td{padding:12px; border-bottom:1px solid var(--line-soft);}
.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-lg);}
.ref-cards{display:none;}
@media(max-width:640px){ .table-scroll{display:none;} .ref-cards{display:grid; gap:10px;} }
.ref-card{border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; background:var(--bg-panel); font-size:13.5px;}
.ref-card div + div{margin-top:6px; padding-top:6px; border-top:1px solid var(--line-soft);}
.ref-card b{color:var(--ink-dim); font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:2px;}

/* diagrams / simulators */
.diagram-box{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; margin:14px 0 18px;}
.diagram-box .lbl{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:8px;}
.diagram-box svg{width:100%; height:auto; display:block;}
.sim-controls{display:grid; gap:14px; margin-top:14px;}
.sim-row{display:flex; align-items:center; gap:12px; font-size:12.5px; font-family:var(--font-mono); color:var(--ink-dim);}
.sim-row input[type=range]{flex:1; accent-color:var(--accent);}
.sim-note{font-size:12px; color:var(--ink-faint); margin-top:10px; font-style:italic;}

/* landing */
.hero{padding:52px 0 34px; text-align:left;}
.hero h1{font-size:clamp(30px,5.4vw,50px); letter-spacing:-.01em; margin-bottom:12px;}
.hero .sub{font-size:clamp(15px,2.2vw,18px); color:var(--ink-dim); max-width:52ch; margin-bottom:26px;}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:28px;}
.hero-stats{display:flex; flex-wrap:wrap; gap:22px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim);}
.hero-stats b{color:var(--ink); font-size:15px; display:block; font-family:var(--font-display);}
.hero-scope{border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--bg-panel); padding:18px; margin-top:34px; overflow:hidden;}
.stage-row{display:flex; align-items:center; flex-wrap:wrap; gap:0; margin:30px 0;}
.stage-pill{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--bg-panel); font-size:12.5px; font-family:var(--font-mono);}
.stage-arrow{color:var(--ink-faint); padding:0 8px; font-size:13px;}
.roadmap-item{display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--line);}
.roadmap-item:last-child{border-bottom:none;}
.roadmap-num{font-family:var(--font-mono); color:var(--accent); font-size:13px; flex:none; width:28px; padding-top:2px;}
.roadmap-item a{text-decoration:none;}

@keyframes scopeReveal{ from{ stroke-dashoffset: var(--len); opacity:0;} to{ stroke-dashoffset:0; opacity:1; } }
.scope-anim path{ stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: scopeReveal 1.6s ease-out forwards; }
@media (prefers-reduced-motion: reduce){ .scope-anim path{ animation:none; stroke-dashoffset:0; opacity:1; } }

/* node tree */
.node-tree{display:flex; flex-direction:column; align-items:stretch; gap:0; max-width:460px; margin:0 auto;}
.node-item{padding:13px 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-panel); font-size:13.5px; font-family:var(--font-mono); text-align:center; position:relative;}
.node-item.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
.node-connector{width:1px; height:20px; background:var(--line); margin:0 auto;}
.node-info{margin-top:20px;}

/* before/after */
.ba-wrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line); user-select:none; touch-action:none;}
.ba-after, .ba-before{position:absolute; inset:0;}
.ba-before{background:linear-gradient(135deg,#8d8878,#6f7268 45%,#87867c);filter:saturate(.35) contrast(.82) brightness(1.08);}
.ba-after{background:linear-gradient(135deg,#0f3d3a,#1c2b3d 40%,#5c3a1e 100%); filter:saturate(1.15) contrast(1.12);}
.ba-after{clip-path: inset(0 0 0 50%);}
.ba-label{position:absolute; top:10px; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; background:rgba(0,0,0,.5); color:#fff; padding:4px 9px; border-radius:4px;}
.ba-label.l{left:10px;} .ba-label.r{right:10px;}
.ba-handle{position:absolute; top:0; bottom:0; left:50%; width:2px; background:#fff; cursor:ew-resize;}
.ba-handle::after{content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4);}
.ba-handle::before{content:'⇔'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; color:#111; font-size:15px;}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:440px; width:100%; padding:22px; box-shadow:var(--shadow);}
.kbd{display:inline-block; padding:2px 7px; border-radius:4px; background:var(--bg-raised); border:1px solid var(--line); font-family:var(--font-mono); font-size:12px;}

/* lesson nav footer */
.lesson-nav{display:flex; gap:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--line);}
.lesson-nav a, .lesson-nav .disabled{flex:1; padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius); text-decoration:none; color:var(--ink);}
.lesson-nav .disabled{opacity:.35; pointer-events:none;}
.lesson-nav .lbl{font-size:11px; font-family:var(--font-mono); color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
.lesson-nav .ttl{font-size:13.5px; margin-top:3px;}
.lesson-nav .next{text-align:right;}

.side-info{display:none;}
@media(min-width:1280px){
  .lesson-grid{display:grid; grid-template-columns:1fr 250px; gap:36px; align-items:start;}
  .side-info{display:block; position:sticky; top:calc(var(--topbar-h) + 24px);}
}
.side-info .card{margin-bottom:14px;}
.side-info .card .k{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:5px;}
.side-info .card .v{font-size:13.5px;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.25s ease; z-index:70;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.search-results{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); max-height:340px; overflow-y:auto; z-index:45; display:none;}
.search-results.open{display:block;}
.search-result{display:block; padding:10px 13px; text-decoration:none; color:var(--ink); font-size:13px; border-bottom:1px solid var(--line-soft);}
.search-result:hover{background:var(--bg-raised);}
.search-result .m{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}

.empty-note{color:var(--ink-faint); font-size:13.5px; font-style:italic;}
.dash-grid{display:grid; gap:16px; grid-template-columns:1fr;}
@media(min-width:820px){ .dash-grid{grid-template-columns:2fr 1fr;} }
.mod-progress-row{display:flex; align-items:center; gap:12px; padding:9px 0; font-size:13px;}
.mod-progress-row .bar{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
.mod-progress-row .bar>span{display:block; height:100%; background:var(--accent2);}
</style>

<script>
/* ============================================================
   4. APPLICATION STATE
   ============================================================ */
const STORAGE_KEY = 'dvrColorCourse_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ console.warn('State load failed', e); }
  return defaultState();
}
function defaultState(){
  return { completed:[], current:null, theme:'dark', bookmarks:[], notes:{}, quizResults:{}, checklist:{}, activity:[] };
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ console.warn('State save failed', e); }
}

/* ============================================================
   5. COURSE DATA
   ============================================================ */
const COURSE_MODULES = [{"id":"m0","title":"Foundations of Color Grading","level":"Beginner","description":"Understand the grading mindset, signal path, scopes, and the order of operations before touching creative controls.","lessons":[{"id":"0.1","title":"What Color Grading Actually Does","difficulty":"Beginner","duration":"10–15 min","why":"A clear mental model prevents random slider changes and makes every later lesson easier to judge.","theory":"Color grading is the controlled process of changing luminance, chroma, hue, and contrast so footage becomes technically sound and visually intentional. A good grade separates correction from creative decisions.","tool":"Primary tools: Primaries wheels, Curves, Scopes","scope":"Waveform and RGB Parade","steps":["Separate technical correction from creative styling.","Identify the intended viewing space.","Use scopes to verify decisions.","Make changes in a deliberate order."],"watch":["Does exposure look plausible?","Are neutral areas neutral?","Is the subject separated from the background?"],"mistakes":[{"title":"Grading by eye only","text":"The display can mislead you; use scopes as objective references."},{"title":"Changing everything at once","text":"You lose cause-and-effect and make troubleshooting harder."}],"tip":"Make one change at a time and always ask what problem that change is solving.","practice":"Take one flat-looking clip and write three technical problems before adjusting anything.","diagram":"pipeline"},{"id":"0.2","title":"Color Pipeline: Camera to Display","difficulty":"Beginner","duration":"10–15 min","why":"Many “bad grades” are actually color-management problems.","theory":"Camera footage is encoded for acquisition, then transformed into a working space, graded, and finally converted for delivery. The transform defines how numerical values are interpreted.","tool":"Color management or Color Space Transform (CST)","scope":"Waveform after each transform","steps":["Identify the camera gamut and gamma.","Choose a working color space.","Place the input transform before creative grading.","Place the output transform at the end."],"watch":["LOG should gain a sensible tonal distribution after the input transform.","The output should match the intended delivery space."],"mistakes":[{"title":"Double transforming","text":"Applying two equivalent transforms can distort contrast and color."},{"title":"Grading in the wrong space","text":"Controls may behave unpredictably or clip unexpectedly."}],"tip":"Treat transforms as part of the signal path, not as creative “looks”.","practice":"Draw your own input → working → output signal path for a sample camera.","diagram":"cst","quiz":{"q":"Where should the input transform normally sit?","options":["After texture","Before the main creative grade","Only after export","Inside the final checklist"],"correct":1,"explain":"The input transform establishes a usable working representation before grading."}},{"id":"0.3","title":"Scopes: Waveform, Parade, Vectorscope","difficulty":"Beginner","duration":"10–15 min","why":"Scopes reduce guesswork and help you spot errors that your eyes adapt to.","theory":"Scopes turn image values into objective graphs. The waveform is mainly for luminance and exposure, the RGB Parade compares channel balance, and the Vectorscope visualizes hue and saturation.","tool":"Video Scopes","scope":"Use all three according to the problem","steps":["Pick the scope that answers the question.","Use waveform for brightness and contrast.","Use RGB Parade for channel balance.","Use Vectorscope for hue and saturation."],"watch":["Look at overall placement rather than chasing a single pixel.","Check faces and saturated colors for plausible ranges."],"mistakes":[{"title":"Treating the vectorscope like a brightness scope","text":"It describes chroma, not luminance."},{"title":"Ignoring channel separation","text":"RGB imbalance can remain invisible on the waveform."}],"tip":"The best scope is the one that answers your current question—not the one that looks most impressive.","practice":"Open the three scopes and describe what each tells you about the same frame.","diagram":"vectorscope","simulator":"vectorscope"},{"id":"0.4","title":"The Professional Hierarchy","difficulty":"Beginner","duration":"10–15 min","why":"A hierarchy prevents polishing the wrong image.","theory":"A reliable grading order is: technical pipeline, light, color hierarchy, toning, compression, texture, and delivery. Each layer depends on the previous one.","tool":"Node graph + primary controls","scope":"Waveform → Parade → Vectorscope → final image","steps":["Solve signal-path issues first.","Balance light and white balance.","Shape color relationships.","Add creative tone.","Finish with restraint."],"watch":["Every later node should have a clear reason to exist.","If a later correction breaks an earlier one, revisit the earlier stage."],"mistakes":[{"title":"Starting with LUTs or grain","text":"Style can hide technical errors."},{"title":"Overbuilding the node tree","text":"More nodes do not automatically mean more control."}],"tip":"Keep the node tree simple enough that you can explain every node in one sentence.","practice":"Create a blank node tree with named stages only.","diagram":"pipeline"}]},{"id":"m1","title":"Color Management & CST","level":"Beginner","description":"Build a robust LOG-to-working-space and working-space-to-delivery pipeline.","lessons":[{"id":"1.1","title":"Identify Camera LOG and Gamut","difficulty":"Beginner","duration":"10–15 min","why":"Incorrect camera identification is a root cause of strange contrast and hue.","theory":"LOG is a gamma/encoding choice; gamut describes the color volume. You need both to interpret camera data correctly.","tool":"Metadata, camera documentation, CST input settings","scope":"Waveform + RGB Parade","steps":["Identify the camera model.","Confirm recorded gamma and gamut.","Do not assume all “LOG” files use the same transform."],"watch":["Contrast should become plausible after the correct transform.","Colors should not shift unexpectedly."],"mistakes":[{"title":"Guessing the camera profile","text":"Similar LOG names can represent different encodings."},{"title":"Using a generic transform blindly","text":"It may create subtle but persistent color errors."}],"tip":"Write the exact input gamma and gamut in your project notes.","practice":"Compare two plausible camera transforms and observe the difference.","diagram":"cst"},{"id":"1.2","title":"Choose a Working Space","difficulty":"Beginner","duration":"10–15 min","why":"The working space influences how primary and secondary operations behave.","theory":"A working space should give grading controls predictable behavior and sufficient range for your intended output.","tool":"Color management / CST","scope":"Waveform and RGB Parade","steps":["Choose the working space deliberately.","Keep input and output transforms separate.","Avoid unnecessary conversions between nodes."],"watch":["Skin should remain stable while exposure changes.","Highlights should not collapse prematurely."],"mistakes":[{"title":"Mixing management systems","text":"Using project-wide management and manual CSTs without a plan causes double transforms."},{"title":"Working in display space too early","text":"It can reduce grading flexibility."}],"tip":"Consistency matters more than a fashionable color space.","practice":"Build a two-transform pipeline and test it with exposure and saturation changes.","diagram":"cst"},{"id":"1.3","title":"Output Transform and Delivery","difficulty":"Beginner","duration":"10–15 min","why":"The grade is not finished until you know what the viewer will receive.","theory":"The final transform maps your graded working image into the target display or delivery space, commonly Rec.709 for standard SDR work.","tool":"Output CST / Color Management","scope":"Waveform in delivery space","steps":["Identify the target.","Place the output transform last.","Check legal and visual range.","Review on the intended display."],"watch":["Highlights remain controlled.","The final image resembles the intended look without surprise contrast shifts."],"mistakes":[{"title":"Applying output transform twice","text":"This can create heavy contrast and clipped color."},{"title":"Judging only in the wrong viewer space","text":"The exported file may not match the timeline preview."}],"tip":"Always name the target delivery space explicitly before the final export.","practice":"Toggle the output transform and note what changes.","diagram":"cst"}]},{"id":"m2","title":"Exposure & White Balance Setup","level":"Beginner","description":"Establish a clean technical baseline before creative grading.","lessons":[{"id":"2.1","title":"Exposure and Middle Gray","difficulty":"Beginner","duration":"10–15 min","why":"A strong baseline prevents later color work from fighting incorrect luminance.","theory":"Exposure is the placement of scene brightness values. Middle gray provides a useful anchor while highlights and shadows establish the useful range.","tool":"Offset, HDR wheels, Lift/Gamma/Gain","scope":"Waveform","steps":["Set overall exposure.","Place important midtones.","Check shadows and highlights.","Re-evaluate after contrast."],"watch":["Important skin or subject tones should sit consistently.","Do not judge exposure from a single bright object."],"mistakes":[{"title":"Chasing 50 IRE as a universal rule","text":"Scene content determines appropriate placement."},{"title":"Raising exposure before fixing the input transform","text":"The scale may be misleading."}],"tip":"Expose for the scene, not for a memorized number.","practice":"Use the waveform simulator to see how a global exposure shift moves the trace.","diagram":"waveform","simulator":"waveform","quiz":{"q":"Which scope is the primary reference for exposure?","options":["Vectorscope","Waveform","RGB Parade only","Histogram only"],"correct":1,"explain":"The waveform is designed to show luminance distribution and placement."}},{"id":"2.2","title":"White Balance with the RGB Parade","difficulty":"Beginner","duration":"10–15 min","why":"A neutral baseline makes later creative color choices easier to control.","theory":"White balance removes unwanted color casts by bringing neutral areas toward a balanced relationship between red, green, and blue.","tool":"Temperature, Tint, RGB balance","scope":"RGB Parade","steps":["Find a neutral reference if available.","Adjust temperature.","Adjust tint.","Confirm with the RGB Parade."],"watch":["Neutral objects should not show a strong channel bias.","Skin should remain believable after the correction."],"mistakes":[{"title":"Using saturation to solve white balance","text":"Saturation does not correct a channel cast."},{"title":"Correcting mood instead of neutrality","text":"Creative tint should come later."}],"tip":"Do technical neutrality first; add a deliberate tint later.","practice":"Use the Parade simulator and introduce a small channel imbalance, then correct it.","diagram":"parade","simulator":"parade"},{"id":"2.3","title":"Contrast Before Style","difficulty":"Beginner","duration":"10–15 min","why":"Color choices become easier to judge when the tonal structure is stable.","theory":"Contrast defines the relationship between shadows, midtones, and highlights. It should be established before detailed color toning.","tool":"Contrast control, Custom Curves","scope":"Waveform","steps":["Set black and white relationships.","Shape the midtone contrast.","Protect important highlights.","Recheck the subject."],"watch":["Avoid crushed blacks and brittle highlights.","Use a curve for subtle shaping instead of extreme moves."],"mistakes":[{"title":"Making a dramatic S-curve immediately","text":"It can hide exposure errors."},{"title":"Ignoring skin during contrast changes","text":"Faces can become too dense or bright."}],"tip":"Make contrast changes progressively and check the whole tonal range after each move.","practice":"Create a neutral, soft-contrast baseline before applying any color mood.","diagram":"scurve"}]},{"id":"m3","title":"Light","level":"Beginner → Intermediate","description":"Build the technical and perceptual lighting foundation of the grade.","lessons":[{"id":"3.1","title":"Read the Waveform","difficulty":"Beginner","duration":"10–15 min","why":"Exposure errors are easier to diagnose when brightness is separated from color.","theory":"The waveform maps image luminance from dark to bright so you can inspect tonal placement without being distracted by hue.","tool":"Waveform","scope":"Waveform","steps":["Open the waveform.","Identify shadow and highlight areas.","Compare subject and background placement."],"watch":["Shadow density","Highlight headroom","Midtone position"],"mistakes":[{"title":"Reading it upside-down mentally","text":"Remember that the vertical axis represents signal level."},{"title":"Judging only the average","text":"Distribution matters, not just the center."}],"tip":"Trace the subject first, then inspect the extremes.","practice":"Describe the luminance structure of a frame in three zones.","diagram":"waveform"},{"id":"3.2","title":"Lift, Gamma, Gain","difficulty":"Beginner","duration":"10–15 min","why":"These controls let you make localized tonal moves without changing everything equally.","theory":"Lift mainly affects lower tones, Gamma affects midtones, and Gain primarily affects higher tones; the exact behavior depends on the grading system.","tool":"Lift / Gamma / Gain wheels","scope":"Waveform","steps":["Adjust the largest problem first.","Use small moves.","Check interactions between ranges."],"watch":["Shadow detail","Face brightness","Highlight continuity"],"mistakes":[{"title":"Moving all three aggressively","text":"This often recreates a global exposure move in a less predictable way."},{"title":"Ignoring channel balance","text":"Primaries can alter both luminance and color."}],"tip":"Prefer subtle corrections that leave room for later creative work.","practice":"Correct a flat clip using separate low, mid, and high tonal adjustments.","diagram":"wheels"},{"id":"3.3","title":"Offset for Global Exposure","difficulty":"Beginner","duration":"10–15 min","why":"It is fast and coherent for a global brightness problem.","theory":"Offset moves the whole image together and is useful for broad exposure corrections before finer tonal shaping.","tool":"Offset","scope":"Waveform","steps":["Identify a global exposure error.","Adjust Offset minimally.","Recheck highlights and shadows."],"watch":["The whole waveform should move coherently.","Do not use Offset to solve a local issue."],"mistakes":[{"title":"Using it for highlight repair","text":"It affects everything."},{"title":"Forgetting to recheck white balance","text":"A luminance move can change perception."}],"tip":"Use the broadest tool that matches the problem, then switch to narrower tools.","practice":"Compare Offset with Gamma on the same frame."},{"id":"3.4","title":"Protect Highlights","difficulty":"Beginner","duration":"10–15 min","why":"Highlight behavior strongly affects perceived quality and realism.","theory":"Bright regions can clip or become harsh when pushed too far. A controlled roll-off preserves information and a more natural transition.","tool":"Soft Clip / HDR highlights","scope":"Waveform","steps":["Find the brightest important regions.","Lower or compress them gently.","Check the waveform and image together."],"watch":["Window highlights","Speculars","Bright skin"],"mistakes":[{"title":"Crushing highlights","text":"Compression is not the same as removing detail."},{"title":"Fixing all highlights equally","text":"Some speculars are supposed to clip."}],"tip":"Protect important detail, not every possible signal value.","practice":"Practice a restrained highlight roll-off on a high-key frame.","diagram":"waveform"},{"id":"3.5","title":"Shape the Tone Curve","difficulty":"Beginner","duration":"10–15 min","why":"A curve can produce a controlled tonal signature without brute-force adjustments.","theory":"Curves provide continuous control over tonal relationships and can add or remove contrast in specific ranges.","tool":"Custom Curves","scope":"Waveform","steps":["Place anchor points.","Shape shadows and highlights separately.","Keep the curve smooth."],"watch":["No abrupt kinks","Midtones retain separation","Highlights remain controlled"],"mistakes":[{"title":"Extreme S-curves","text":"They often create brittle images."},{"title":"Too many control points","text":"Complexity makes the result harder to predict."}],"tip":"Use as few control points as possible.","practice":"Build a subtle S-curve and compare it to a simple Contrast control.","diagram":"scurve"},{"id":"3.6","title":"Local Exposure with Windows","difficulty":"Beginner","duration":"10–15 min","why":"Local control is essential when the subject and environment need different treatment.","theory":"A Power Window isolates a region so you can adjust exposure without affecting the whole frame.","tool":"Power Window + tracker","scope":"Waveform + visual inspection","steps":["Create a simple shape.","Feather it.","Track if the subject moves.","Make a small exposure adjustment."],"watch":["Edge quality","Natural falloff","Subject readability"],"mistakes":[{"title":"Hard edges","text":"Feather and track carefully."},{"title":"Over-brightening the face","text":"Local corrections should remain plausible."}],"tip":"The best window is often the one the viewer never notices.","practice":"Lift a subject slightly while keeping the background unchanged."},{"id":"3.7","title":"Balance a Full Shot","difficulty":"Beginner","duration":"10–15 min","why":"Consistency is a professional skill; isolated beautiful frames are not enough.","theory":"A balanced frame has coherent brightness from shot to shot and within the frame, with intentional emphasis on the subject.","tool":"Primaries + Curves + Windows","scope":"Waveform","steps":["Set global exposure.","Balance shadows/mids/highlights.","Add local correction if needed.","Compare to neighboring shots."],"watch":["Continuity","Subject prominence","Highlight/shadow consistency"],"mistakes":[{"title":"Matching only by eye","text":"Use the scopes and contextual comparison."},{"title":"Overcorrecting one shot","text":"Aim for sequence continuity."}],"tip":"Judge the shot in sequence, not only by itself.","practice":"Balance three frames so they feel like one scene."},{"id":"3.8","title":"Light Checkpoint","difficulty":"Beginner","duration":"10–15 min","why":"A checkpoint prevents creative grading from hiding unresolved technical problems.","theory":"Before moving into color hierarchy, the image should have a stable technical exposure, credible white balance, controlled contrast, and clear subject separation.","tool":"Waveform + RGB Parade + final image","scope":"All three scopes","steps":["Check exposure.","Check midtones.","Check white balance.","Check contrast.","Check highlights and shadows.","Confirm subject clarity."],"watch":["Exposure is correct","Important midtones are positioned appropriately","White balance is believable","Contrast is controlled","Highlights are protected","Shadows are readable","Subject is clear"],"mistakes":[{"title":"Skipping the checkpoint","text":"Later corrections become harder to diagnose."},{"title":"Tweaking mood too early","text":"It biases technical judgment."}],"tip":"Do not start styling until you can defend the technical baseline.","practice":"Run the complete checklist on one shot.","diagram":"waveform"}]},{"id":"m4","title":"Color Hierarchy","level":"Intermediate","description":"Use selective color control to direct attention and simplify competing hues.","lessons":[{"id":"4.1","title":"Think in Color Relationships","difficulty":"Beginner","duration":"10–15 min","why":"A frame feels intentional when color has a clear visual priority.","theory":"Color hierarchy is about deciding which hues should attract attention and which should support the main subject.","tool":"Color curves / selective tools","scope":"Vectorscope + image","steps":["Identify the focal subject.","List dominant and competing colors.","Decide what should lead."],"watch":["Focal hue","Supporting palette","Unwanted competition"],"mistakes":[{"title":"Adding saturation everywhere","text":"This destroys hierarchy."},{"title":"Ignoring luminance","text":"Color attention depends on brightness too."}],"tip":"Hierarchy is subtraction as often as addition.","practice":"Describe the intended color priority of a scene in one sentence."},{"id":"4.2","title":"Hue vs Sat","difficulty":"Beginner","duration":"10–15 min","why":"It lets you mute distractions while keeping an intentional focal color.","theory":"Hue vs Sat changes saturation in selected hue ranges without changing every color equally.","tool":"Hue vs Sat","scope":"Vectorscope","steps":["Sample the unwanted hue.","Reduce it gently.","Protect nearby hues.","Recheck the focal color."],"watch":["Natural transitions","No isolated color “holes”","Focal hue remains strong"],"mistakes":[{"title":"Creating gray patches","text":"Use a restrained reduction."},{"title":"Aiming too narrowly","text":"Adjacent hues can break the transition."}],"tip":"Use broad, smooth adjustments for believable palette control.","practice":"Mute one competing hue while protecting skin.","diagram":"huesat","quiz":{"q":"What is a common use for Hue vs Sat?","options":["Global exposure","Selective saturation control","Lens distortion","Noise reduction"],"correct":1,"explain":"Hue vs Sat lets you change saturation for selected hue ranges."}},{"id":"4.3","title":"Lum vs Sat","difficulty":"Beginner","duration":"10–15 min","why":"Saturation often feels harsher in certain brightness ranges; this tool helps unify the palette.","theory":"Lum vs Sat changes saturation according to luminance, letting you control how bright or dark colors behave.","tool":"Lum vs Sat","scope":"Vectorscope","steps":["Identify where saturation feels too strong.","Target the luminance range.","Reduce or increase saturation gradually."],"watch":["Avoid unnatural dullness","Keep subject color alive","Watch dark saturated regions"],"mistakes":[{"title":"Flattening all dark color","text":"The goal is control, not desaturation."},{"title":"Ignoring noise in shadows","text":"Color noise can become more visible."}],"tip":"Use Lum vs Sat as a compression tool for difficult color ranges.","practice":"Reduce overly saturated dark foliage while keeping brighter greens.","diagram":"huesat"},{"id":"4.4","title":"Color Slice by Range","difficulty":"Beginner","duration":"10–15 min","why":"Selective palette shaping is often faster with a range-based tool than manual masks.","theory":"Color Slice isolates a selected color family so you can control its contribution to the frame.","tool":"Color Slice","scope":"Vectorscope","steps":["Pick the target range.","Refine the selection.","Adjust saturation or density.","Check neighboring colors."],"watch":["Selection spill","Natural transitions","Skin protection"],"mistakes":[{"title":"Too broad a selection","text":"You may change skin or neutrals."},{"title":"Too narrow a range","text":"Edges can look discontinuous."}],"tip":"Always inspect what else belongs to the selected hue family.","practice":"Choose one background hue and reduce its dominance without changing skin."},{"id":"4.5","title":"Protect Skin Tones","difficulty":"Beginner","duration":"10–15 min","why":"Viewers are highly sensitive to unnatural skin.","theory":"Skin is both a color and a visual anchor. A hue hierarchy should never accidentally make faces strange while fixing the background.","tool":"Qualifier / Hue vs Hue / Power Window","scope":"Vectorscope skin-tone line","steps":["Identify skin range.","Protect it from global hue moves.","Recheck under the final contrast."],"watch":["Skin remains believable","Hue stays coherent across shots","No clipping of selected range"],"mistakes":[{"title":"Using one skin sample for everything","text":"Lighting changes alter skin values."},{"title":"Trusting the line blindly","text":"The line is a reference, not a guarantee of reality."}],"tip":"Protect the subject first; style the environment around it.","practice":"Make a background hue move and verify skin remains unchanged."},{"id":"4.6","title":"Direct the Eye with Color","difficulty":"Beginner","duration":"10–15 min","why":"Color alone rarely creates hierarchy; it must cooperate with tone and composition.","theory":"The eye is guided by contrast, saturation, and hue difference together. Color hierarchy works best when all three support the subject.","tool":"Primary saturation + selective curves","scope":"Vectorscope + waveform","steps":["Strengthen focal separation.","Reduce irrelevant competition.","Balance brightness and saturation."],"watch":["Does attention land where intended?","Is the background supporting the subject?"],"mistakes":[{"title":"Over-saturating the subject","text":"This can look synthetic."},{"title":"Ignoring composition","text":"Color cannot fix every visual problem."}],"tip":"The goal is attention control, not maximum color.","practice":"Perform a subtle focal-color enhancement and compare before/after.","diagram":"colorslice"},{"id":"4.7","title":"Color Hierarchy Checkpoint","difficulty":"Beginner","duration":"10–15 min","why":"A checkpoint ensures the creative palette is intentional before toning.","theory":"At this stage the focal color is identified, competitors are controlled, and skin remains believable.","tool":"Hue vs Sat + Lum vs Sat + Color Slice","scope":"Vectorscope","steps":["Identify focal color.","Mute competing colors.","Check skin.","Review the frame at a glance."],"watch":["Focal color is identified","Competing colors are muted","Skin tones checked against the Vectorscope line","Hierarchy still reads clearly at a glance"],"mistakes":[{"title":"Over-stylizing","text":"Hierarchy can become a gimmick."},{"title":"Changing the mood unintentionally","text":"Save toning decisions for the next stage."}],"tip":"Ask: “What color should I notice first?” then verify the image supports the answer.","practice":"Run the hierarchy checklist on one frame.","diagram":"vectorscope"}]},{"id":"m5","title":"Color Toning","level":"Intermediate","description":"Add a controlled creative mood after the technical and hierarchical work is stable.","lessons":[{"id":"5.1","title":"Define the Mood First","difficulty":"Beginner","duration":"10–15 min","why":"A defined intention prevents random stylistic experimentation.","theory":"A good creative grade can be expressed as a short sentence such as “warm highlights, cooler shadows, restrained saturation.”","tool":"Notes + Lift/Gamma/Gain","scope":"Vectorscope + image","steps":["Write one mood sentence.","Choose a primary toning direction.","Keep the base correction intact."],"watch":["Consistency","Skin protection","Overall emotional direction"],"mistakes":[{"title":"Starting with a preset","text":"The preset may not fit the footage."},{"title":"Stacking conflicting looks","text":"One clear mood is easier to control."}],"tip":"Name the mood before you build it.","practice":"Write a one-sentence mood for three different scenes."},{"id":"5.2","title":"Shadow and Highlight Color","difficulty":"Beginner","duration":"10–15 min","why":"Subtle split toning creates depth and visual identity.","theory":"Toning often separates shadows and highlights slightly to create a color relationship rather than a flat neutral image.","tool":"Lift/Gamma/Gain or Log wheels","scope":"Vectorscope","steps":["Choose a shadow hue.","Choose a highlight hue.","Keep saturation restrained.","Check neutral areas."],"watch":["Color separation","Neutral balance","Skin"],"mistakes":[{"title":"Too much saturation","text":"The effect becomes obvious and artificial."},{"title":"Using complementary colors aggressively","text":"The palette can become hostile."}],"tip":"Think in relationships: cool vs warm, dense vs airy, muted vs vivid.","practice":"Build a very subtle cool-shadow/warm-highlight relationship.","diagram":"wheels"},{"id":"5.3","title":"Warm/Cool Contrast","difficulty":"Beginner","duration":"10–15 min","why":"Temperature contrast is a powerful cinematic device because it can organize spatial and emotional relationships.","theory":"Warm and cool hues can create depth and subject separation when the scene supports it.","tool":"Color wheels / temperature","scope":"Vectorscope","steps":["Choose which side is warmer.","Limit the cool side to supportive areas.","Recheck skin."],"watch":["Mood","Depth","Naturalness"],"mistakes":[{"title":"Making the whole frame orange/blue","text":"Contrast requires separation."},{"title":"Ignoring practical light sources","text":"The grade should respect the scene."}],"tip":"Use environmental logic to justify your color choices.","practice":"Create a restrained warm-key/cool-fill style without changing exposure.","diagram":"wheels"},{"id":"5.4","title":"Gamma for Midtone Character","difficulty":"Beginner","duration":"10–15 min","why":"Small midtone changes can transform mood without destroying shadows or highlights.","theory":"The midtones contain much of the subject’s visible color and are useful for subtle character shaping.","tool":"Gamma / Log midtone controls","scope":"Waveform + Vectorscope","steps":["Make a small midtone hue move.","Check skin and neutrals.","Compare at normal viewing size."],"watch":["Skin hue","Midtone density","Overall mood"],"mistakes":[{"title":"Large Gamma color pushes","text":"They dominate the entire frame."},{"title":"Forgetting contrast context","text":"Color can feel stronger after a contrast change."}],"tip":"Midtone toning should usually be felt before it is seen.","practice":"Apply a small midtone tint and judge its effect at normal viewing size."},{"id":"5.5","title":"Use Saturation as a Creative Control","difficulty":"Beginner","duration":"10–15 min","why":"Saturation changes how strongly your chosen palette communicates.","theory":"Creative toning can include a saturation target: restrained, natural, dense, faded, or vivid.","tool":"Global saturation + selective saturation","scope":"Vectorscope","steps":["Set a global level.","Refine selected hues.","Protect skin and neutrals."],"watch":["Palette cohesion","Skin","Highlight color"],"mistakes":[{"title":"Pushing global saturation too far","text":"Every problem becomes more visible."},{"title":"Desaturating everything to look cinematic","text":"Cinematic does not mean colorless."}],"tip":"A smaller saturation move often feels more expensive.","practice":"Create two versions: restrained and vivid, then compare their mood."},{"id":"5.6","title":"Keep the Look Consistent Across Shots","difficulty":"Beginner","duration":"10–15 min","why":"Professional grading is about continuity, not one perfect still.","theory":"A look is only useful when it survives changes in framing and exposure across a sequence.","tool":"Gallery/stills + scopes","scope":"Waveform + Vectorscope","steps":["Choose a hero frame.","Match neighboring shots.","Apply the same creative principles, not blind settings."],"watch":["Skin continuity","Palette consistency","Exposure continuity"],"mistakes":[{"title":"Copying settings blindly","text":"Different shots respond differently."},{"title":"Ignoring scene cuts","text":"Color relationships can shift between setups."}],"tip":"Match the intent first, then the numerical settings.","practice":"Create a three-shot mini-sequence with one consistent mood."},{"id":"5.7","title":"Color Toning Checkpoint","difficulty":"Beginner","duration":"10–15 min","why":"This checkpoint keeps creative work from overruling technical quality.","theory":"The creative mood should be clearly defined, technically stable, and restrained enough to preserve believable skin and tonal structure.","tool":"Lift/Gamma/Gain + selective controls","scope":"Vectorscope + Waveform","steps":["Define the mood.","Confirm shadow/highlight choices.","Protect skin.","Verify the vectorscope push is controlled."],"watch":["Mood is defined in one sentence","Shadow and highlight color choices support that mood","Skin protected after toning","Vectorscope shows a controlled, intentional push"],"mistakes":[{"title":"Turning toning into a LUT hunt","text":"The creative decision should come first."},{"title":"Pushing chroma until it looks impressive","text":"Judge the whole frame and the sequence."}],"tip":"A successful look supports the story without announcing the controls behind it.","practice":"Run the complete toning checkpoint before moving on.","diagram":"vectorscope"}]},{"id":"m6","title":"Color Compression","level":"Intermediate","description":"Unify the palette and reduce overly clinical RGB separation without losing the established mood.","lessons":[{"id":"6.1","title":"Why Compress Color","difficulty":"Beginner","duration":"10–15 min","why":"Compression is a finishing strategy for coherence, not a substitute for correction.","theory":"Digital sources can produce very clean channel separation. Controlled compression can make the palette feel more unified.","tool":"RGB Mixer / channel mixing","scope":"RGB Parade + Vectorscope","steps":["Confirm the grade first.","Introduce a subtle channel blend.","Check skin and saturation."],"watch":["Channel separation","Palette cohesion","No loss of intended hue relationships"],"mistakes":[{"title":"Heavy channel mixing","text":"It can destroy color identity."},{"title":"Using compression before hierarchy","text":"It changes the palette before hierarchy is established."}],"tip":"Compression should be almost invisible as an isolated effect.","practice":"Compare a neutral grade with a subtle channel blend.","diagram":"mixer"},{"id":"6.2","title":"Use RGB Mixer Deliberately","difficulty":"Beginner","duration":"10–15 min","why":"It gives precise control over channel interaction.","theory":"The RGB Mixer changes output channel contributions. Small changes can soften aggressive color separation and create a cohesive response.","tool":"RGB Mixer","scope":"RGB Parade + Vectorscope","steps":["Make one output-channel change.","Check all three output channels.","Compare against the original."],"watch":["Neutral areas","Skin","Saturated colors"],"mistakes":[{"title":"Changing all channels at once","text":"Diagnosis becomes difficult."},{"title":"Using it to fix white balance","text":"White balance belongs earlier."}],"tip":"Know which output channel you are changing before touching its matrix.","practice":"Make a subtle mix and observe the Parade response.","diagram":"mixer"},{"id":"6.3","title":"Keep the Palette Coherent","difficulty":"Beginner","duration":"10–15 min","why":"Coherence is often what makes a grade feel finished.","theory":"A coherent palette has related colors that support the scene instead of independent digital primaries fighting each other.","tool":"RGB Mixer + Hue/Sat tools","scope":"RGB Parade + Vectorscope","steps":["Look for the strongest digital color.","Compress it gently.","Recheck the hierarchy."],"watch":["No washed skin","No flattened palette","Mood remains intact"],"mistakes":[{"title":"Over-compressing","text":"The image becomes dull."},{"title":"Treating every shot the same","text":"Scene-specific color deserves individual judgment."}],"tip":"Use compression only after you already like the image.","practice":"Refine one shot until the color feels unified but still alive."},{"id":"6.4","title":"Compression Check","difficulty":"Beginner","duration":"10–15 min","why":"This is the handoff from creative design to finishing.","theory":"The final palette should be unified without erasing the intentional hierarchy and mood you already built.","tool":"RGB Mixer + scopes","scope":"RGB Parade + Vectorscope","steps":["Compare before/after.","Check skin.","Check focal color.","Check overall density."],"watch":["Subtlety","Consistency","Preserved intent"],"mistakes":[{"title":"Chasing a “film” button","text":"Compression is a supporting treatment."},{"title":"Ignoring artifacts","text":"Zoom in and inspect problem areas."}],"tip":"Stop as soon as the palette becomes more coherent.","practice":"Do one final compression pass on a hero frame.","diagram":"parade","simulator":"parade"}]},{"id":"m7","title":"Texture & Final Finish","level":"Intermediate","description":"Apply restrained texture, inspect at full size, and prepare the image for delivery.","lessons":[{"id":"7.1","title":"Film Grain with Restraint","difficulty":"Beginner","duration":"10–15 min","why":"Texture can integrate a clean digital image but should not hide a weak grade.","theory":"Grain adds temporal and spatial texture. Its perceived strength depends on image size, contrast, and viewing distance.","tool":"Film Grain","scope":"Visual inspection at 100%","steps":["Finish the grade first.","Choose grain size and strength.","Check at normal viewing size."],"watch":["Pattern visibility","Shadow noise","Skin texture"],"mistakes":[{"title":"Using grain to hide noise","text":"It can compound artifacts."},{"title":"Applying too much grain","text":"Texture becomes the subject."}],"tip":"If viewers notice the grain before the image, it is probably too strong.","practice":"Compare no grain, subtle grain, and excessive grain."},{"id":"7.2","title":"Sharpening and Perceived Detail","difficulty":"Beginner","duration":"10–15 min","why":"Final detail treatment should be subtle and display-aware.","theory":"Sharpening changes edge contrast and can improve perceived detail, but too much creates halos and harsh digital texture.","tool":"Sharpen / midtone detail","scope":"100% zoom + normal viewing","steps":["Apply a small amount.","Inspect high-contrast edges.","Check faces."],"watch":["Halos","Edge noise","Skin texture"],"mistakes":[{"title":"Sharpening before noise reduction","text":"It can exaggerate noise."},{"title":"Judging only zoomed in","text":"The effect may disappear or become too strong at normal size."}],"tip":"Use 100% to detect artifacts, but judge the final image at normal viewing size.","practice":"Add a minimal sharpening pass and inspect text and skin.","diagram":"waveform"},{"id":"7.3","title":"Final Quality Pass","difficulty":"Beginner","duration":"10–15 min","why":"The last review is where small technical mistakes become visible.","theory":"A finishing pass checks the entire image without making new creative decisions.","tool":"Scopes + full-frame viewer","scope":"Waveform, Parade, Vectorscope","steps":["Review full frame.","Check scopes.","Check skin.","Check edges and texture.","Compare before/after."],"watch":["Clipping","Color casts","Artifacts","Over-processing"],"mistakes":[{"title":"Making new stylistic changes at the end","text":"Late changes can destabilize the grade."},{"title":"Skipping before/after","text":"You can lose perspective on cumulative changes."}],"tip":"Final review is for verification, not experimentation.","practice":"Perform a complete pre-export inspection."},{"id":"7.4","title":"Delivery Check","difficulty":"Beginner","duration":"10–15 min","why":"A perfect grade can still fail if exported incorrectly.","theory":"Delivery means converting and exporting the final image in the correct technical space, resolution, frame rate, and codec.","tool":"Project settings + Deliver page","scope":"Final delivery signal","steps":["Confirm target space.","Confirm resolution and frame rate.","Export a short test.","Review the exported file."],"watch":["Gamma shifts","Clipping","Frame-rate mismatch","Unexpected scaling"],"mistakes":[{"title":"Skipping an export test","text":"Small setup errors can affect the whole render."},{"title":"Changing color settings during delivery without understanding them","text":"Keep the delivery pipeline deliberate."}],"tip":"Always test the actual exported file, not only the timeline viewer.","practice":"Export a short test clip and compare it with the timeline.","diagram":"cst"}]},{"id":"m8","title":"Practical Review & Mastery","level":"Intermediate","description":"Turn the full workflow into a repeatable practical method and build speed without sacrificing control.","lessons":[{"id":"8.1","title":"Build a Repeatable Node Tree","difficulty":"Beginner","duration":"10–15 min","why":"Consistency in structure improves speed and communication.","theory":"A node tree should reflect the grading hierarchy so you can troubleshoot and adjust without losing control.","tool":"Serial nodes / named nodes","scope":"Node tree + scopes","steps":["Create technical nodes.","Create light nodes.","Add color hierarchy and toning.","Finish with compression and texture.","Keep output separate."],"watch":["One job per node","Readable names","Stable signal flow"],"mistakes":[{"title":"Everything in one node","text":"Hard to troubleshoot."},{"title":"Hundreds of tiny nodes","text":"Hard to maintain."}],"tip":"Use a small number of purposeful stages.","practice":"Build the full node tree from memory.","diagram":"pipeline"},{"id":"8.2","title":"Shot Matching Strategy","difficulty":"Beginner","duration":"10–15 min","why":"Sequence consistency is a stronger test than a single still.","theory":"Shot matching means preserving exposure, color balance, contrast, and creative intent across different frames.","tool":"Gallery / stills / scopes","scope":"Waveform + Parade + Vectorscope","steps":["Pick a reference shot.","Balance exposure.","Match white balance.","Match palette.","Review the sequence."],"watch":["Continuity","Subject skin","Background color"],"mistakes":[{"title":"Copying grades blindly","text":"Camera angle and lighting change the response."},{"title":"Matching only saturation","text":"Tonal differences remain."}],"tip":"Match the hierarchy of the image, not just its numbers.","practice":"Match three shots from the same scene."},{"id":"8.3","title":"Final Practical: LOG to Cinematic","difficulty":"Beginner","duration":"10–15 min","why":"Practice is where the hierarchy becomes automatic.","theory":"The complete workflow combines technical transformation, light, hierarchy, toning, compression, and texture into one controlled sequence.","tool":"Full workflow","scope":"All scopes + final image","steps":["Transform.","Balance light.","Correct white balance.","Build color hierarchy.","Tone the image.","Compress color.","Add texture.","Review and export."],"watch":["Each stage has a reason","No step undoes a previous step","The final image remains believable"],"mistakes":[{"title":"Skipping technical steps because the image “looks okay”","text":"Looks can change after delivery."},{"title":"Adding style before solving exposure","text":"The creative stage becomes a distraction."}],"tip":"Make the workflow boringly repeatable; creativity should happen inside a stable process.","practice":"Grade one complete LOG shot from start to export using the course hierarchy.","diagram":"pipeline"}]},{"id":"m9","title":"Complete Workflow","level":"Reference","description":"A concise end-to-end grading workflow you can return to while working in Resolve.","workflow":[{"step":1,"title":"Input transform","theory":"Interpret the camera LOG footage in the chosen working space.","why":"Technical values must be meaningful before creative adjustments.","tool":"CST or project color management","scope":"Waveform","procedure":"Identify camera gamma/gamut and apply the correct input transform.","check":"The image has a sensible tonal and color range.","mistake":"Applying the input transform twice."},{"step":2,"title":"Light","theory":"Establish exposure, midtone placement, contrast, and highlight/shadow control.","why":"Tonal structure is the foundation of the grade.","tool":"Offset, HDR wheels, Curves","scope":"Waveform","procedure":"Set global exposure, refine tonal ranges, and protect important highlights.","check":"Subject reads clearly and the tonal range is controlled.","mistake":"Using global exposure to solve a local problem."},{"step":3,"title":"White balance + contrast","theory":"Neutralize unwanted casts and establish the contrast shape.","why":"Creative color should sit on a believable technical baseline.","tool":"Temperature/Tint, RGB balance, Curves","scope":"RGB Parade + Waveform","procedure":"Neutralize channels and shape contrast gently.","check":"Neutrals are plausible and contrast is stable.","mistake":"Styling the color cast instead of correcting it."},{"step":4,"title":"Color hierarchy","theory":"Decide which colors lead the viewer and which support the subject.","why":"Intentional hierarchy creates focus.","tool":"Hue vs Sat, Lum vs Sat, Color Slice","scope":"Vectorscope","procedure":"Protect the focal color and mute competing hues.","check":"The eye lands where intended.","mistake":"Increasing global saturation to create impact."},{"step":5,"title":"Color toning","theory":"Add a controlled mood through shadow, midtone, and highlight relationships.","why":"This creates visual identity without rebuilding the technical base.","tool":"Lift/Gamma/Gain, Log wheels","scope":"Vectorscope","procedure":"Define the mood, choose the color relationship, and keep it restrained.","check":"The mood is clear and skin remains believable.","mistake":"Pushing chroma until the look becomes the subject."},{"step":6,"title":"Soft clip + color compression","theory":"Roll off harsh highlights and gently unify digital channel separation.","why":"Finishing can make a strong grade feel cohesive.","tool":"Soft Clip, RGB Mixer","scope":"Waveform + RGB Parade","procedure":"Apply only the amount needed for smoothness and cohesion.","check":"No loss of intentional palette.","mistake":"Using compression as a substitute for proper color work."},{"step":7,"title":"Texture","theory":"Add restrained grain or detail enhancement after the image is already finished.","why":"Texture should polish rather than redefine.","tool":"Film Grain, Sharpen","scope":"Visual review at 100%","procedure":"Apply subtle texture and inspect at normal viewing size.","check":"No obvious artifacts or over-processing.","mistake":"Using texture to hide weak grading."},{"step":8,"title":"Output transform","theory":"Map the working image into the target delivery space.","why":"The final viewer must receive the intended image.","tool":"Output CST / Color Management","scope":"Waveform","procedure":"Apply the correct output transform and confirm delivery settings.","check":"Exported media matches the intended target.","mistake":"Double-transforming the image."}]}];

let FLAT_LESSONS = [];
COURSE_MODULES.forEach(m=>{
  (m.lessons||[]).forEach(l=> FLAT_LESSONS.push({...l, moduleId:m.id, moduleTitle:m.title, moduleLevel:m.level}));
});
const TOTAL_LESSONS = FLAT_LESSONS.length;

function findLesson(id){ return FLAT_LESSONS.find(l=>l.id===id); }

function renderLessonHeader(l, idx){
  return `
  <div style="margin-bottom:22px;">
    <div class="eyebrow-mono">${findModule(l.moduleId).title.toUpperCase()}${l.moduleLevel?' · '+l.moduleLevel:''}</div>
    <h1 style="font-size:clamp(23px,3.4vw,32px); margin:8px 0 12px;">Lesson ${l.id} — ${escapeHtml(l.title)}</h1>
    <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
      <span class="badge">${l.difficulty}</span>
      <span class="badge">${l.duration}</span>
      <span class="badge">Lesson ${idx+1} of ${TOTAL_LESSONS}</span>
      ${STATE.completed.includes(l.id) ? '<span class="badge badge-accent">Completed</span>' : ''}
    </div>
  </div>`;
}

function renderLesson(id){
  const l = findLesson(id);
  if(!l){ return `<div class="page"><p>Lesson not found.</p><a class="btn btn-primary" href="#dashboard">Go to dashboard</a></div>`; }
  STATE.current = id; saveState();
  const idx = lessonIndex(id);
  const prev = FLAT_LESSONS[idx-1], next = FLAT_LESSONS[idx+1];
  const isDone = STATE.completed.includes(id);
  const isBooked = STATE.bookmarks.includes(id);

  const body = `
  <div class="lesson-grid">
    <div>
      ${renderLessonHeader(l, idx)}

      <div class="section-card why">
        <h3>${iconEye()} Why this lesson matters</h3>
        <p>${escapeHtml(l.why)}</p>
      </div>

      <div class="section-card">
        <h3>${iconBook()} Theory</h3>
        <p>${escapeHtml(l.theory)}</p>
      </div>

      <div class="section-card tool">
        <h3>${iconTool()} Tool</h3>
        <p>${escapeHtml(l.tool)}</p>
      </div>

      <div class="section-card">
        <h3>${iconScope()} Scope</h3>
        <p>${escapeHtml(l.scope)}</p>
      </div>

      ${l.diagram ? renderDiagramBox(l.diagram) : ''}
      ${l.simulator ? renderSimulatorBox(l.simulator) : ''}

      <div class="section-card">
        <h3>${iconList()} How to use it</h3>
        <ol class="step-list">${l.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>
      </div>

      <div class="section-card">
        <h3>${iconTarget()} What to watch for</h3>
        <ul class="watch-list">${l.watch.map(w=>`<li>${iconEye()}<span>${escapeHtml(w)}</span></li>`).join('')}</ul>
      </div>

      <div class="section-card">
        <h3>${iconWarn()} Common mistakes</h3>
        ${l.mistakes.map(m=>`<div class="mistake-card">${iconWarn()}<div><strong>${escapeHtml(m.title)}</strong><p>${escapeHtml(m.text)}</p></div></div>`).join('')}
      </div>

      <div class="tip-card" style="margin-bottom:16px;">${iconTip()}<div><strong style="display:block;font-size:13.5px;margin-bottom:3px;">Beginner tip</strong><p style="font-size:13.5px;">${escapeHtml(l.tip)}</p></div></div>

      <div class="section-card">
        <h3>${iconTarget()} Practice</h3>
        <p>${escapeHtml(l.practice)}</p>
      </div>

      ${l.id==="3.8" ? renderChecklistBlock('light-checkpoint', 'Light checkpoint', LIGHT_CHECKPOINT_ITEMS) : ''}

function moduleProgressText(moduleId){
  const m = findModule(moduleId);
  const lessons = m.lessons || [];
  const done = lessons.filter(l=>STATE.completed.includes(l.id)).length;
  return `${done} / ${lessons.length} lessons completed`;
}

function renderQuiz(l){
  const q = l.quiz;
  const saved = STATE.quizResults[l.id];
  const optionsHtml = q.options.map((opt,i)=>{
    let cls = 'quiz-opt';
    if(saved){
      if(i===q.correct) cls += ' correct';
      else if(i===saved.selected) cls += ' incorrect';
    }
    return `<label class="${cls}"><input type="radio" name="quiz-${l.id}" value="${i}" ${saved && saved.selected===i?'checked':''} ${saved?'disabled':''}><span>${escapeHtml(opt)}</span></label>`;
  }).join('');
  const feedback = saved ? `<div class="quiz-feedback ${saved.selected===q.correct?'ok':'no'}">${saved.selected===q.correct ? "That's right. " : 'Not quite. '}${escapeHtml(q.explain)}</div>` : '';
  return `
  <div class="section-card">
    <h3>${iconTarget()} Checkpoint</h3>
    <p style="font-weight:500; margin-bottom:12px;">${escapeHtml(q.q)}</p>
    <form id="quizForm-${l.id}" onsubmit="return submitQuiz(event,'${l.id}')">
      ${optionsHtml}
      ${!saved ? `<button type="submit" class="btn btn-primary btn-sm" style="margin-top:8px;">Check answer</button>` : `<button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="retryQuiz('${l.id}')">Try again</button>`}
    </form>
    ${feedback}
  </div>`;
}
function submitQuiz(e, lessonId){
  e.preventDefault();
  const form = document.getElementById('quizForm-'+lessonId);
  const sel = form.querySelector('input[name="quiz-'+lessonId+'"]:checked');
  if(!sel){ showToast('Pick an answer first'); return false; }
  const l = findLesson(lessonId);
  STATE.quizResults[lessonId] = { selected: parseInt(sel.value,10), correct: l.quiz.correct };
  saveState(); render();
  return false;
}
function retryQuiz(lessonId){ delete STATE.quizResults[lessonId]; saveState(); render(); }

function renderChecklistBlock(checklistId, title, items){
  const state = STATE.checklist[checklistId] || {};
  const doneCount = items.filter((_,i)=>state[i]).length;
  const pct = Math.round((doneCount/items.length)*100);
  return `
  <div class="section-card">
    <h3>${iconCheck()} ${escapeHtml(title)}</h3>
    <div class="checklist-progress"><span style="width:${pct}%"></span></div>
    ${items.map((item,i)=>`
      <label class="checklist-item ${state[i]?'checked':''}">
        <input type="checkbox" ${state[i]?'checked':''} onchange="toggleChecklistItem('${checklistId}', ${i}, ${items.length})">
        <span>${escapeHtml(item)}</span>
      </label>`).join('')}
  </div>`;
}
function toggleChecklistItem(checklistId, i, total){
  if(!STATE.checklist[checklistId]) STATE.checklist[checklistId] = {};
  STATE.checklist[checklistId][i] = !STATE.checklist[checklistId][i];
  saveState(); render();
}

function toggleComplete(id){
  const has = STATE.completed.includes(id);
  if(has){ STATE.completed = STATE.completed.filter(x=>x!==id); }
  else{
    STATE.completed.push(id);
    STATE.activity.unshift({id, at: Date.now()});
    STATE.activity = STATE.activity.slice(0,12);
    showToast('Lesson marked complete');
  }
  saveState(); render();
}
function toggleBookmark(id){
  const has = STATE.bookmarks.includes(id);
  if(has) STATE.bookmarks = STATE.bookmarks.filter(x=>x!==id);
  else { STATE.bookmarks.push(id); showToast('Bookmarked'); }
  saveState(); renderSidebarOnly();
}
function saveNote(id, value){
  STATE.notes[id] = value; saveState();
}

function updateWfSim(){
  const ex = parseInt(document.getElementById('wfExposure').value,10);
  document.getElementById('wfExposureVal').textContent = ex;
  const base = [120,80,140,70,110,50,90,60];
  const pts = base.map((y,i)=> Math.max(6, Math.min(154, y - ex)));
  let d = `M0,${pts[0]}`;
  pts.forEach((y,i)=>{ const x = i*(400/(pts.length-1)); d += ` L${x.toFixed(1)},${y.toFixed(1)}`; });
  const path = document.getElementById('wfSimPath'); if(path) path.setAttribute('d', d);
}
function updateParSim(){
  const r = parseInt(document.getElementById('parR').value,10);
  const g = parseInt(document.getElementById('parG').value,10);
  const b = parseInt(document.getElementById('parB').value,10);
  document.getElementById('parRVal').textContent=r; document.getElementById('parGVal').textContent=g; document.getElementById('parBVal').textContent=b;
  const svg = document.getElementById('parSimSvg'); if(!svg) return;
  svg.querySelectorAll('.parBar').forEach(n=>n.remove());
  const colors=['#DD6E52','#5FB88A','#4C8FE0']; const vals=[r,g,b];
  vals.forEach((v,i)=>{
    const h = Math.max(4, Math.min(150, 80 - v));
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','parBar'); rect.setAttribute('x', 10+i*133+20); rect.setAttribute('y', h); rect.setAttribute('width', 73); rect.setAttribute('height', 160-h); rect.setAttribute('fill', colors[i]); rect.setAttribute('opacity','0.75');
    svg.appendChild(rect);
  });
}
function updateVecSim(){
  const hue = parseInt(document.getElementById('vecHue').value,10);
  const sat = parseInt(document.getElementById('vecSat').value,10);
  document.getElementById('vecHueVal').textContent = hue+'°';
  document.getElementById('vecSatVal').textContent = sat+'%';
  const rad = (hue-90) * Math.PI/180;
  const r = (sat/100)*105;
  const x = 130 + r*Math.cos(rad);
  const y = 130 + r*Math.sin(rad);
  const dot = document.getElementById('vecDot');
  if(dot){ dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', y.toFixed(1)); }
}

function initBeforeAfter(){
  const wrap = document.getElementById('baWrap'); if(!wrap) return;
  const handle = document.getElementById('baHandle'); const after = document.getElementById('baAfter');
  function setPct(pct){
    pct = Math.max(0,Math.min(100,pct));
    after.style.clipPath = `inset(0 0 0 ${pct}%)`;
    handle.style.left = pct+'%';
  }
  function fromEvent(e){
    const rect = wrap.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    setPct((x/rect.width)*100);
  }
  let dragging=false;
  wrap.addEventListener('mousedown', e=>{dragging=true; fromEvent(e);});
  window.addEventListener('mousemove', e=>{if(dragging) fromEvent(e);});
  window.addEventListener('mouseup', ()=>dragging=false);
  wrap.addEventListener('touchstart', e=>{dragging=true; fromEvent(e);});
  wrap.addEventListener('touchmove', e=>{if(dragging) fromEvent(e);});
  wrap.addEventListener('touchend', ()=>dragging=false);
}

  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  if(tag==='input' || tag==='textarea') return;
  if(e.key==='Escape'){ closeDrawer(); closeKbdModal(); return; }
  if(e.key==='m' || e.key==='M'){ const d=document.getElementById('mobileSidebar'); if(d && d.classList.contains('open')) closeDrawer(); else openDrawer(); return; }
  const route = currentRoute();
  if(route.view==='lesson'){
    const idx = lessonIndex(route.param);
    if(e.key==='ArrowUp' && FLAT_LESSONS[idx-1]){ go('#lesson/'+FLAT_LESSONS[idx-1].id); }
    if(e.key==='ArrowDown' && FLAT_LESSONS[idx+1]){ go('#lesson/'+FLAT_LESSONS[idx+1].id); }
    if(e.key==='b' || e.key==='B'){ toggleBookmark(route.param); }
    if(e.key==='c' || e.key==='C'){ toggleComplete(route.param); }
  }
  if(e.key==='s' || e.key==='S'){
    const el = document.getElementById('topSearchInput');
    if(el && el.offsetParent!==null){ e.preventDefault(); el.focus(); }
    else go('#search');
  }
});
document.getElementById('kbdModal') && document.getElementById('kbdModal').addEventListener('click', (e)=>{ if(e.target.id==='kbdModal') closeKbdModal(); });
window.addEventListener('resize', ()=>{ const m=document.getElementById('menuBtn'); if(m) m.style.display = window.innerWidth<1024?'inline-flex':'none'; });

/* ============================================================
   16. INITIALIZATION / MAIN RENDER
   ============================================================ */
function render(){
  const route = currentRoute();
  closeDrawer();
  if(route.view==='lesson' && route.param){
    const l = findLesson(route.param);
    if(l) expandedModules.add(l.moduleId);
  }
  let viewHtml = '';
  try{
    if(route.view==='landing') viewHtml = renderLanding();
    else if(route.view==='dashboard') viewHtml = renderDashboard();
    else if(route.view==='lesson') viewHtml = renderLesson(route.param);
    else if(route.view==='reference') viewHtml = renderReference();
    else if(route.view==='nodetree') viewHtml = renderNodeTree();
    else if(route.view==='checklist') viewHtml = renderChecklistPage();
    else if(route.view==='workflow') viewHtml = renderWorkflow();
    else if(route.view==='search') viewHtml = renderSearchPage();
    else viewHtml = renderLanding();
  }catch(err){
    console.error('Render error', err);
    viewHtml = `<div class="page"><p>Something went wrong rendering this page.</p><a class="btn btn-primary" href="#landing">Go home</a></div>`;
  }

  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="topbar">${topbarHtml()}</header>
    <div class="mobile-sidebar" id="mobileSidebar">
      <div class="mobile-sidebar-head">
        <span style="font-family:var(--font-display);font-weight:600;font-size:14px;">Menu</span>
        <button class="icon-btn" onclick="closeDrawer()" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="mobileSidebarInner">${sidebarHtml(route)}</div>
    </div>
    <div class="shell">
      <aside class="sidebar" id="sidebarInner">${sidebarHtml(route)}</aside>
      <main class="content" id="mainContent" tabindex="-1">${viewHtml}</main>
    </div>
  `;
  window.scrollTo({top:0, behavior:'auto'});
  if(route.view==='lesson'){
    const l = findLesson(route.param);
    if(l){
      if(l.simulator==='waveform') updateWfSim();
      if(l.simulator==='parade') updateParSim();
      if(l.simulator==='vectorscope') updateVecSim();
    }
  }
  if(route.view==='workflow') initBeforeAfter();
}

document.documentElement.setAttribute('data-theme', STATE.theme || 'dark');
if(!location.hash) location.hash = '#landing';
render();
</script>
</body>
</html>
